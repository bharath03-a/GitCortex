# Targets and expected evidence are fixed independently of GitCortex output.
# `required` strings are source-grounded evidence that must appear in output.

[[tasks]]
id = "ripgrep-search-searcher"
repo = "ripgrep"
action = "search"
query = "Searcher"
required = ["crates/searcher/src/searcher/mod.rs", "Searcher"]
forbidden = ["tests/integration"]
max_bytes = 5000
# Searcher and SearcherBuilder are both defined in searcher/mod.rs (lines 597, 298).
relevant_files = ["crates/searcher/src/searcher/mod.rs"]
relevant_symbols = ["Searcher", "SearcherBuilder"]

[[tasks]]
id = "ripgrep-tour"
repo = "ripgrep"
action = "tour"
required = ["crates/searcher/src", "crates/printer/src"]
max_bytes = 5000

[[tasks]]
id = "ripgrep-callers-line-number"
repo = "ripgrep"
action = "callers"
query = "crate::Searcher::line_number"
required = ["crates/core/flags/hiargs.rs"]
max_bytes = 4000
min_evidence = 1

[[tasks]]
id = "ripgrep-neighborhood-line-number"
repo = "ripgrep"
action = "subgraph"
query = "crate::Searcher::line_number"
required = ["crates/searcher/src/searcher/mod.rs"]
max_bytes = 3500
min_evidence = 1

[[tasks]]
id = "requests-search-session"
repo = "requests"
action = "search"
query = "Session"
required = ["src/requests/sessions.py", "Session"]
max_bytes = 5000
# Session (line 395) and SessionRedirectMixin (line 127) are defined in sessions.py.
# api.py only instantiates Session, so it is not a definition hit.
relevant_files = ["src/requests/sessions.py"]
relevant_symbols = ["Session", "SessionRedirectMixin"]

[[tasks]]
id = "requests-tour"
