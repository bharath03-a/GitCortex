# commit source (grep/read), never guessed and never read back from gcx.

[[tasks]]
id = "tokio-search-notify"
repo = "tokio"
action = "search"
query = "Notify"
required = ["tokio/src/sync/notify.rs", "Notify"]
max_bytes = 5000
# Notify is defined once, at tokio/src/sync/notify.rs:199.
relevant_files = ["tokio/src/sync/notify.rs"]
relevant_symbols = ["Notify"]

[[tasks]]
id = "tokio-callers-notify-waiters"
repo = "tokio"
action = "callers"
query = "crate::Notify::notify_waiters"
# watch.rs's BigNotify::notify_waiters (line 406) loops over an array of
# Notify and calls notify.notify_waiters() on each — a real call site.
required = ["tokio/src/sync/watch.rs"]
max_bytes = 4000
min_evidence = 1

