name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "scripts/build_release_page.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read the repo and mint a Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: pages · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render release log from CHANGELOG.md
        run: python3 scripts/build_release_page.py

      # assets/icon.svg and assets/favicon.ico stay the single source for the
      # mark; the site gets a copy at build time rather than a second checked-in
      # file to keep in sync.
      - name: Copy favicon from the shared icon
        run: |
          cp assets/icon.svg docs/favicon.svg
          cp assets/favicon.ico docs/favicon.ico

      # The site is hand-written HTML; Jekyll would otherwise try to process
      # the Markdown files sitting alongside it in docs/.
      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    name: pages · deploy
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
