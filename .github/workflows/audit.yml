name: Audit

# Supply-chain checks on every PR (including stacks), main, weekly, and on demand.

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}
  schedule:
    # Mondays 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-deny
      # Use the runner's preinstalled stable cargo for `cargo metadata` so
      # rust-toolchain.toml does not trigger a ~20s toolchain download here.
      - name: Run cargo-deny
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --workspace check

  cargo-audit:
    name: cargo-audit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        run: cargo-audit audit --deny warnings

  npm-audit:
    name: npm audit (viz)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Don't fail on every advisory — warn for moderate, fail on high/critical
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
