name: Audit

# Supply-chain checks on every PR (including stacks), main, weekly, and on demand.

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}
  schedule:
    # Mondays 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  cargo-audit:
    name: cargo-audit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: true

  npm-audit:
    name: npm audit (viz)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Don't fail on every advisory — warn for moderate, fail on high/critical
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
