name: CodeQL

# Advanced setup because default setup cannot select Rust through the API.
# Test fixtures are intentionally odd multi-language samples, so they are excluded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql · ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - tests/integration/fixtures
              - target
              - viz/node_modules
              - crates/gitcortex-viz/dist-viz
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
