name: CI

on:
  push:
    branches: [main]
  # Stacked PRs target stack branches, not only main.
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier 0: path filter + fast static checks ────────────────────────────────
  # On pull_request, skip heavy build/test jobs for untouched subsystems (e.g.
  # docs-only or Python-only PRs) while CI required still verifies every
  # applicable check passed. On push to main, merge_group, and manual dispatch,
  # every job runs unconditionally.

  changes:
    name: changes · path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
      hooks: ${{ github.event_name != 'pull_request' || steps.filter.outputs.hooks == 'true' }}
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      viz: ${{ github.event_name != 'pull_request' || steps.filter.outputs.viz == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflows:
              - '.github/**'
            hooks:
              - 'hooks/**'
              - '.github/workflows/ci.yml'
            python:
              - 'scripts/**'
              - 'tools/**'
              - 'deny.toml'
              - '.cargo/audit.toml'
              - 'CHANGELOG.md'
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/ci.yml'
            viz:
              - 'viz/**'
              - 'assets/icon.svg'
              - 'assets/favicon.ico'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - 'viz/**'
              - 'assets/**'
              - 'hooks/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  workflow-lint:
    name: actions · workflow lint
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck=

  typos:
    name: typos · spell check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  shellcheck:
    name: shellcheck · hook scripts
    needs: [changes]
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by SHA (v7.0.1): the floating v7 tag hit an Internal Server
      # Error during GitHub's action-resolution step; the SHA form skips it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck hooks/post-commit hooks/post-merge hooks/post-rewrite hooks/post-checkout

  # Continuous-coding fixtures invoke pytest in child interpreters. Install the
  # declared test dependency on clean runners before unittest discovery.
  # The Pages generator also runs here because its output reaches users.
  python-tools:
    name: python · tooling tests
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/agent-bench/requirements-test.txt
      - name: Install benchmark test dependencies
        run: python3 -m pip install -r tools/agent-bench/requirements-test.txt
      - name: agent-bench
        working-directory: tools/agent-bench
        run: python3 -m unittest discover -p "test_*.py" -v
      - name: release page generator
        working-directory: scripts
        run: python3 -m unittest discover -p "test_*.py" -v
      - name: advisory ignore parity
        run: python3 scripts/check_advisory_ignores.py deny.toml .cargo/audit.toml
      - name: release page renders from the real changelog
        run: |
          python3 scripts/build_release_page.py
          test -s docs/releases.html

  # cargo-machete parses Cargo.toml and .rs files directly without invoking
  # rustc, so it does not need a toolchain install or rust-cache entry.
  cargo-machete:
    name: rust · unused deps (machete)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-machete
      - run: cargo machete

  # ── Tier 1: build viz once, cache across Rust-only PRs, reuse everywhere ────

  viz-bundle:
    name: viz · lint + test + build bundle
    needs: [changes]
    if: needs.changes.outputs.viz == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cache built viz bundle
        id: viz-cache
        uses: actions/cache@v6
        with:
          path: crates/gitcortex-viz/dist-viz
          key: viz-dist-${{ hashFiles('viz/**', 'assets/icon.svg', 'assets/favicon.ico') }}
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.viz == 'true' || steps.viz-cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: viz/package-lock.json
      - name: Check and build viz frontend
        if: needs.changes.outputs.viz == 'true' || steps.viz-cache.outputs.cache-hit != 'true'
        working-directory: viz
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Bundle size check (2.5 MB ceiling)
        if: needs.changes.outputs.viz == 'true' || steps.viz-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path("crates/gitcortex-viz/dist-viz").rglob("*") if p.is_file())
          print(f"Bundle: {size} bytes")
          if not 0 < size < 2500 * 1024:
              raise SystemExit("Bundle is empty or exceeds the 2.5 MB ceiling")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
          retention-days: 1
          # Fail loudly: a silent no-op upload leaves every dependent job to
          # fail later on a missing artifact instead of here, at the cause.
          if-no-files-found: error

  # ── Tier 2: Rust checks (parallel; Linux links prebuilt libkuzu.so) ─────────
  # All workspace jobs use the pinned rust-toolchain.toml toolchain (1.95).
  # Linux lint/doc, test, and coverage jobs link the SHA256-verified prebuilt
  # libkuzu.so so cold builds take ~1–2 min instead of ~15–20 min and each
  # cache stays ~200 MB (preventing GitHub's 10 GB repo cache eviction loop).
  # binary-smoke still compiles the statically-linked bundled KuzuDB release
  # binary in parallel so static bundling is verified on every Rust PR.

  rust-lint-doc:
    name: rust · fmt + clippy + doc
    needs: [changes, viz-bundle]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
      - uses: ./.github/actions/setup-libkuzu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-lint-doc-kuzu-shared"
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo doc
        run: cargo doc --workspace --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  rust-build-test:
    name: rust · ubuntu-latest
    needs: [changes, viz-bundle]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Line tables keep full file:line backtraces while cutting debuginfo
      # size and link time substantially.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
      - uses: ./.github/actions/setup-libkuzu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-test-kuzu-shared"
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked --all-targets
        env:
          NEXTEST_PROFILE: ci
      - run: cargo test --workspace --locked --doc

  # macOS keeps bundled static KuzuDB (macOS libkuzu.dylib hides C++ exception
  # RTTI across the dylib boundary) and stays gated to pushes on main.
  rust-build-test-macos:
    name: rust · macos-latest
    needs: [changes, viz-bundle]
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kuzu-macos-dev
          max-size: 500M
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-latest-1.95"
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked --all-targets
        env:
          NEXTEST_PROFILE: ci
      - run: cargo test --workspace --locked --doc

  coverage:
    name: rust · coverage
    needs: [changes, viz-bundle]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-libkuzu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-cov-kuzu-shared"
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-llvm-cov,nextest
      - name: Run tests with coverage
        run: |
          cargo llvm-cov nextest --workspace --locked \
            --ignore-filename-regex '(tools\.rs|gitcortex-viz/src/lib\.rs)' \
            --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Coverage threshold (60%)
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex '(tools\.rs|gitcortex-viz/src/lib\.rs)' \
            --fail-under-lines 60

  # Runs in parallel with tests/lint/coverage and verifies the statically-linked
  # bundled KuzuDB release binary using a dedicated cache key + ccache.
  binary-smoke:
    name: rust · binary smoke test
    needs: [changes, viz-bundle]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kuzu-ubuntu-release-smoke
          max-size: 500M
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-release-smoke"
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - run: cargo build --release --bin gcx --locked
      - run: ./target/release/gcx --version
      - run: ./target/release/gcx --help
      - name: gcx doctor (outside git repo)
        run: |
          cd "$(mktemp -d)"
          if "$GITHUB_WORKSPACE/target/release/gcx" doctor >doctor.log 2>&1; then
            cat doctor.log
            echo "doctor must fail outside a Git repository" >&2
            exit 1
          else
            status=$?
          fi
          cat doctor.log
          test "$status" -eq 1
          grep -F "not inside a git repository" doctor.log
          grep -F "cd into a git repo first" doctor.log

  required:
    name: CI required
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - workflow-lint
      - typos
      - shellcheck
      - python-tools
      - viz-bundle
      - cargo-machete
      - rust-lint-doc
      - rust-build-test
      - rust-build-test-macos
      - coverage
      - binary-smoke
    steps:
      - name: Require all applicable checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOWS_CHANGED: ${{ needs.changes.outputs.workflows }}
          HOOKS_CHANGED: ${{ needs.changes.outputs.hooks }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          VIZ_CHANGED: ${{ needs.changes.outputs.viz }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          event_name = os.environ["EVENT_NAME"]

          def flag(name: str) -> bool:
              return os.environ.get(name) == "true"

          workflows = flag("WORKFLOWS_CHANGED")
          hooks = flag("HOOKS_CHANGED")
          python_changed = flag("PYTHON_CHANGED")
          viz = flag("VIZ_CHANGED")
          rust = flag("RUST_CHANGED")

          expected_to_run = {
              "changes": True,
              "typos": True,
              "workflow-lint": workflows,
              "shellcheck": hooks,
              "python-tools": python_changed,
              "viz-bundle": viz or rust,
              "cargo-machete": rust,
              "rust-lint-doc": rust,
              "rust-build-test": rust,
              "rust-build-test-macos": event_name == "push" and rust,
              "coverage": rust,
              "binary-smoke": rust,
          }

          failures = {}
          for job, details in results.items():
              expected = "success" if expected_to_run.get(job, True) else "skipped"
              if details["result"] != expected:
                  failures[job] = f"got {details['result']!r}, expected {expected!r}"
          if failures:
              raise SystemExit(f"Required checks did not pass: {failures}")
          print("All applicable CI checks passed")
          PY
