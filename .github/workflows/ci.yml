name: CI

on:
  push:
    branches: [main]
  # Stacked PRs target stack branches, not only main.
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: actions · workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: actionlint
      - run: actionlint -shellcheck=""

  # ── Tier 0: fast static checks (no Rust/Node build) ─────────────────────────

  typos:
    name: typos · spell check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  shellcheck:
    name: shellcheck · hook scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pinned by SHA (v7.0.1): the floating v7 tag hit an Internal Server
      # Error during GitHub's action-resolution step; the SHA form skips it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck hooks/post-commit hooks/post-merge hooks/post-rewrite hooks/post-checkout

  # The benchmark harness and the Pages release-log generator are Python and
  # ship no dependencies, so this needs nothing but a stdlib interpreter. The
  # generator writes the published site, so a regression here reaches users.
  python-tools:
    name: python · tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: agent-bench
        working-directory: tools/agent-bench
        run: python3 -m unittest discover -p "test_*.py" -v
      - name: release page generator
        working-directory: scripts
        run: python3 -m unittest discover -p "test_*.py" -v
      - name: advisory ignore parity
        run: python3 scripts/check_advisory_ignores.py deny.toml .cargo/audit.toml
      - name: release page renders from the real changelog
        run: |
          python3 scripts/build_release_page.py
          test -s docs/releases.html

  # ── Tier 1: build viz once, upload as artifact, reuse everywhere ─────────────

  viz-bundle:
    name: viz · lint + test + build bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: viz/package-lock.json
      - name: Check and build viz frontend
        working-directory: viz
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Bundle size check (2.5 MB ceiling)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path("crates/gitcortex-viz/dist-viz").rglob("*") if p.is_file())
          print(f"Bundle: {size} bytes")
          if not 0 < size < 2500 * 1024:
              raise SystemExit("Bundle is empty or exceeds the 2.5 MB ceiling")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
          retention-days: 1
          # Fail loudly: a silent no-op upload leaves every dependent job to
          # fail later on a missing artifact instead of here, at the cause.
          if-no-files-found: error

  # ── Tier 2: Rust lint (uses viz artifact) ────────────────────────────────────

  rust-fmt-clippy:
    name: rust · fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [viz-bundle]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-doc:
    name: rust · doc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [viz-bundle]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable-doc"
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - name: cargo doc
        run: cargo doc --workspace --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  cargo-machete:
    name: rust · unused deps (machete)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable-machete"
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-machete
      - run: cargo machete

  # ── Tier 3: build + test ──────────────────────────────────────────────────────
  # PRs: Linux stable + MSRV only (fast feedback).
  # Push to main: adds macOS (linker/platform check).

  rust-build-test:
    name: rust · ubuntu-latest · ${{ matrix.toolchain }}
    # Runs in parallel with rust-fmt-clippy (not gated behind it) — nothing
    # here technically needs lint to pass first, and clippy alone takes
    # ~16min (mostly KuzuDB's C++ build), so serializing this after it used
    # to roughly double the PR's wall-clock time for no correctness benefit.
    # Both still gate the merge check individually.
    needs: [viz-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.95"]
    steps:
      - uses: actions/checkout@v7
      # Pinned by commit rather than @master: that is a moving branch with full
      # access to the runner. Safe to pin here because the toolchain is selected
      # by the input below rather than by the ref, which is why the @stable
      # usages elsewhere in this file cannot be pinned the same way.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-latest-${{ matrix.toolchain }}"
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: nextest
      - run: cargo build --workspace --locked --all-targets
      - run: cargo nextest run --workspace --locked
        env:
          NEXTEST_PROFILE: ci
      - run: cargo test --workspace --locked --doc

  # Separate job rather than a matrix leg: the macOS runner is ~10× slower, so it
  # is gated to pushes on main. A job-level `if` can read `github` but never
  # `matrix`, so this cannot be expressed as a conditionally-skipped matrix entry.
  rust-build-test-macos:
    name: rust · macos-latest · stable
    needs: [viz-bundle]
    runs-on: macos-latest
    timeout-minutes: 90
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-latest-stable"
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: nextest
      - run: cargo build --workspace --locked --all-targets
      - run: cargo nextest run --workspace --locked
        env:
          NEXTEST_PROFILE: ci
      - run: cargo test --workspace --locked --doc

  # ── Tier 4: coverage ─────────────────────────────────────────────────────────

  coverage:
    name: rust · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [viz-bundle]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable-cov"
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-llvm-cov,nextest
      - name: Run tests with coverage
        run: |
          cargo llvm-cov nextest --workspace \
            --ignore-filename-regex '(tools\.rs|gitcortex-viz/src/lib\.rs)' \
            --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Coverage threshold (60%)
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex '(tools\.rs|gitcortex-viz/src/lib\.rs)' \
            --fail-under-lines 60

  # ── Tier 5: binary smoke test ────────────────────────────────────────────────

  binary-smoke:
    name: rust · binary smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rust-build-test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Same key as ubuntu-stable build-test — hits warm cache
          shared-key: "ubuntu-stable"
      - uses: actions/download-artifact@v8
        with:
          name: viz-dist
          path: crates/gitcortex-viz/dist-viz/
      - run: cargo build --release --bin gcx --locked
      - run: ./target/release/gcx --version
      - run: ./target/release/gcx --help
      - name: gcx doctor (outside git repo)
        run: |
          cd "$(mktemp -d)"
          if "$GITHUB_WORKSPACE/target/release/gcx" doctor >doctor.log 2>&1; then
            cat doctor.log
            echo "doctor must fail outside a Git repository" >&2
            exit 1
          else
            status=$?
          fi
          cat doctor.log
          test "$status" -eq 1
          grep -F "not inside a git repository" doctor.log
          grep -F "cd into a git repo first" doctor.log

  required:
    name: CI required
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - workflow-lint
      - typos
      - shellcheck
      - python-tools
      - viz-bundle
      - rust-fmt-clippy
      - rust-doc
      - cargo-machete
      - rust-build-test
      - rust-build-test-macos
      - coverage
      - binary-smoke
    steps:
      - name: Require all applicable checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failures = {}
          for job, details in results.items():
              if job == "rust-build-test-macos" and os.environ["EVENT_NAME"] != "push":
                  allowed = {"skipped"}
              else:
                  allowed = {"success"}
              if details["result"] not in allowed:
                  failures[job] = details["result"]
          if failures:
              raise SystemExit(f"Required checks did not pass: {failures}")
          print("All applicable CI checks passed")
          PY
