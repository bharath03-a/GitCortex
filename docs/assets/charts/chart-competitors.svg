<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-label="Competitor Head-to-Head: Evidence Accuracy &amp; Uncached Tokens">
  <style>
    .t-title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #14141A; letter-spacing: -0.02em; }
