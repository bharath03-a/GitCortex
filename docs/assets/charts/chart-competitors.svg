  <line x1="0" y1="65" x2="920" y2="65" stroke="#E5E4DE" stroke-width="1"/>
  <text x="24" y="29" class="t-title">Competitor Head-to-Head: Evidence Accuracy &amp; Uncached Tokens</text>
  <text x="24" y="49" class="t-sub">Same model (Codex gpt-6.1-sol, low), same pinned commits, same evidence contracts. GitCortex achieves 1.000 accuracy on both suites.</text>
  <text x="24" y="92" class="t-sec">15-Task Core Suite · vs Graphify 0.9.44</text>
  <text x="24" y="109" class="t-axis">impact / architecture / refactor across ripgrep, requests, hono, cobra, gson</text>
  <text x="24" y="136" class="t-lbl2">Evidence Accuracy (mean 0–1)</text>
  <text x="128" y="161" text-anchor="end" class="t-lbl">Baseline grep</text>
  <rect x="136" y="148" width="175" height="18" rx="3" fill="#F5F5F1"/>
  <rect x="136" y="148" width="169.2" height="18" rx="3" fill="#9E9EA8"/>
  <text x="319" y="161" class="t-val">0.967 (14/15)</text>
  <text x="128" y="189" text-anchor="end" class="t-lbl">GitCortex v0.8</text>
