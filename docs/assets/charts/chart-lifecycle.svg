    <text x="102" y="277" text-anchor="end" class="t-axis">del 845 ms</text>
    <rect x="114" y="246" width="210.0" height="16" rx="3" fill="#C97D63"/>
    <text x="332.0" y="258" class="t-val">&gt;60 s timeout</text>
    <rect x="114" y="268" width="30.4" height="16" rx="3" fill="#266B59"/>
    <text x="152.4" y="280" class="t-val-g">820 ms (>73×)</text>
    <text x="102" y="331" text-anchor="end" class="t-lbl">django</text>
    <text x="102" y="347" text-anchor="end" class="t-axis">del 6.56 s</text>
    <rect x="114" y="316" width="210.0" height="16" rx="3" fill="#C97D63"/>
    <text x="332.0" y="328" class="t-val">&gt;60 s timeout</text>
    <rect x="114" y="338" width="79.2" height="16" rx="3" fill="#266B59"/>
    <text x="201.2" y="350" class="t-val-g">6.87 s (>9×)</text>
    <line x1="480" y1="94" x2="480" y2="398" stroke="#E2E0D8" stroke-width="1"/>
    <text x="504" y="108" class="t-sec">5-Branch Churn &amp; Storage Reclaim</text>
    <rect x="813.6" y="95" width="118.4" height="18" rx="9" fill="#FBF0EB"/><text x="872.8" y="107" text-anchor="middle" class="t-chip" fill="#C4633F">84–85% reclaimed</text>
    <rect x="504" y="121.5" width="10" height="10" rx="2.5" fill="#947123"/><text x="519" y="130" class="t-lbl2">After 5 feature branches (unpruned)</text>
    <rect x="504" y="139.5" width="10" height="10" rx="2.5" fill="#C4633F"/><text x="519" y="148" class="t-lbl2">After storage gc --apply + compact</text>
    <line x1="594" y1="168" x2="594" y2="386" stroke="#E2E0D8" stroke-width="1"/>
    <line x1="653.2" y1="168" x2="653.2" y2="386" stroke="#ECEAE2" stroke-width="1"/>
