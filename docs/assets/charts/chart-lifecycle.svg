    <line x1="0" y1="411" x2="960" y2="411" stroke="#ECEAE2" stroke-width="1"/>
    <text x="28" y="432" class="t-foot">All 3 repos passed symbol add/delete verification and dry-run zero-deletion safety checks before --apply.</text>
