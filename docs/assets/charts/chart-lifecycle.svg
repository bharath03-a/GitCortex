    <text x="610.0" y="210" class="t-val-b">14.2 MiB (-84.1%)</text>
    <text x="582" y="261" text-anchor="end" class="t-lbl">tokio</text>
    <text x="582" y="277" text-anchor="end" class="t-axis">1.87 s</text>
    <rect x="594" y="246" width="56.1" height="16" rx="3" fill="#947123" opacity="0.82"/>
    <text x="658.1" y="258" class="t-val">189.7 MiB</text>
    <rect x="594" y="268" width="8.5" height="16" rx="3" fill="#C4633F"/>
    <text x="610.5" y="280" class="t-val-b">28.7 MiB (-84.9%)</text>
    <text x="582" y="331" text-anchor="end" class="t-lbl">django</text>
    <text x="582" y="347" text-anchor="end" class="t-axis">3.71 s</text>
    <rect x="594" y="316" width="200.0" height="16" rx="3" fill="#947123" opacity="0.82"/>
    <text x="802.0" y="328" class="t-val">676.1 MiB</text>
