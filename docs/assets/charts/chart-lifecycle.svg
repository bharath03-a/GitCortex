<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-label="Operational Lifecycle: Incremental Hooks &amp; Multi-Branch Storage Reclaim">
  <style>
    .t-title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #14141A; letter-spacing: -0.02em; }
    .t-sub { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #55555F; }
    .t-sec { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #8A8A94; letter-spacing: 0.1em; text-transform: uppercase; }
    .t-lbl { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #14141A; }
    .t-lbl2 { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #55555F; }
    .t-val { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #14141A; }
    .t-val-b { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #C4633F; }
    .t-val-g { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #2F6F5E; }
    .t-axis { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #8A8A94; }
    .t-foot { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #8A8A94; }
    .t-badge { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
  </style>
  <rect x="0.5" y="0.5" width="919" height="409" rx="10" fill="#FFFFFF" stroke="#E5E4DE" stroke-width="1"/>
  <rect x="1" y="1" width="918" height="64" rx="9" fill="#FCFCFA"/>
  <line x1="0" y1="65" x2="920" y2="65" stroke="#E5E4DE" stroke-width="1"/>
  <text x="24" y="29" class="t-title">Operational Lifecycle: Incremental Hooks &amp; Multi-Branch Storage Reclaim</text>
  <text x="24" y="49" class="t-sub">Measured on isolated git clones: 1-file edit + revert via gcx hook, plus 5-branch churn reclaimed via storage gc &amp; compact.</text>
  <text x="24" y="92" class="t-sec">1-File Commit Hook Latency (gcx hook)</text>
  <rect x="24" y="105" width="11" height="11" rx="2.5" fill="#C78B74"/><text x="40" y="114" class="t-lbl2">Pre-fix (global re-reconcile)</text>
  <rect x="230" y="105" width="11" height="11" rx="2.5" fill="#2F6F5E"/><text x="246" y="114" class="t-lbl2">v0.8.0 (incremental diff + PK batch)</text>
  <text x="94" y="164" text-anchor="end" class="t-lbl">ripgrep</text>
  <text x="94" y="179" text-anchor="end" class="t-axis">del 422 ms</text>
  <rect x="104" y="146" width="58.7" height="17" rx="3" fill="#C78B74"/>
  <text x="168.7" y="158.5" class="t-val">4,170 ms</text>
  <rect x="104" y="168" width="21.0" height="17" rx="3" fill="#2F6F5E"/>
  <text x="131.0" y="180.5" class="t-val-g">423 ms (9.9× faster)</text>
  <text x="94" y="238" text-anchor="end" class="t-lbl">tokio</text>
  <text x="94" y="253" text-anchor="end" class="t-axis">del 845 ms</text>
  <rect x="104" y="220" width="195.0" height="17" rx="3" fill="#C78B74"/>
  <text x="305.0" y="232.5" class="t-val">&gt;60,000 ms (timeout)</text>
  <rect x="104" y="242" width="28.3" height="17" rx="3" fill="#2F6F5E"/>
  <text x="138.3" y="254.5" class="t-val-g">820 ms (>73× faster)</text>
  <text x="94" y="312" text-anchor="end" class="t-lbl">django</text>
  <text x="94" y="327" text-anchor="end" class="t-axis">del 6556 ms</text>
  <rect x="104" y="294" width="195.0" height="17" rx="3" fill="#C78B74"/>
  <text x="305.0" y="306.5" class="t-val">&gt;60,000 ms (timeout)</text>
  <rect x="104" y="316" width="73.5" height="17" rx="3" fill="#2F6F5E"/>
  <text x="183.5" y="328.5" class="t-val-g">6872 ms (>9× faster)</text>
  <line x1="468" y1="80" x2="468" y2="364" stroke="#E5E4DE" stroke-width="1"/>
  <text x="492" y="92" class="t-sec">5-Branch Churn &amp; Storage Reclaim (gc + compact)</text>
  <rect x="492" y="105" width="11" height="11" rx="2.5" fill="#8A6D28"/><text x="508" y="114" class="t-lbl2">After 5 feature branches</text>
  <rect x="680" y="105" width="11" height="11" rx="2.5" fill="#C4633F"/><text x="696" y="114" class="t-lbl2">After gc --apply + compact</text>
  <text x="560" y="164" text-anchor="end" class="t-lbl">ripgrep</text>
  <text x="560" y="179" text-anchor="end" class="t-axis">0.76s</text>
  <rect x="570" y="146" width="26.4" height="17" rx="3" fill="#8A6D28" opacity="0.78"/>
  <text x="602.4" y="158.5" class="t-val">89.1 MiB</text>
  <rect x="570" y="168" width="8.0" height="17" rx="3" fill="#C4633F"/>
  <text x="584.0" y="180.5" class="t-val-b">14.2 MiB (-84.1%)</text>
  <text x="560" y="238" text-anchor="end" class="t-lbl">tokio</text>
  <text x="560" y="253" text-anchor="end" class="t-axis">1.87s</text>
  <rect x="570" y="220" width="56.1" height="17" rx="3" fill="#8A6D28" opacity="0.78"/>
  <text x="632.1" y="232.5" class="t-val">189.7 MiB</text>
  <rect x="570" y="242" width="8.5" height="17" rx="3" fill="#C4633F"/>
  <text x="584.5" y="254.5" class="t-val-b">28.7 MiB (-84.9%)</text>
  <text x="560" y="312" text-anchor="end" class="t-lbl">django</text>
  <text x="560" y="327" text-anchor="end" class="t-axis">3.71s</text>
  <rect x="570" y="294" width="200.0" height="17" rx="3" fill="#8A6D28" opacity="0.78"/>
  <text x="776.0" y="306.5" class="t-val">676.1 MiB</text>
  <rect x="570" y="316" width="30.8" height="17" rx="3" fill="#C4633F"/>
  <text x="606.8" y="328.5" class="t-val-b">104.1 MiB (-84.6%)</text>
  <line x1="24" y1="378" x2="896" y2="378" stroke="#EFEEE9" stroke-width="1"/>
  <text x="24" y="397" class="t-foot">All 3 repos passed symbol add/delete verification and dry-run zero-deletion safety checks before --apply.</text>
</svg>
