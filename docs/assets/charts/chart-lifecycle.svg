    <text x="28" y="34" class="t-title">Operational Lifecycle: Incremental Hooks &amp; Multi-Branch Storage Reclaim</text>
    <text x="28" y="56" class="t-sub">Isolated git clones: 1-file edit + revert via gcx hook, plus 5-branch churn reclaimed via storage gc &amp; compact.</text>
