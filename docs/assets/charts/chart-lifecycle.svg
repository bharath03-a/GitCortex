    <rect x="335.2" y="95" width="124.8" height="18" rx="9" fill="#E9F4F0"/><text x="397.6" y="107" text-anchor="middle" class="t-chip" fill="#266B59">Up to &gt;73× faster</text>
    <rect x="28" y="121.5" width="10" height="10" rx="2.5" fill="#C97D63"/><text x="43" y="130" class="t-lbl2">Pre-fix (global re-reconcile)</text>
    <rect x="28" y="139.5" width="10" height="10" rx="2.5" fill="#266B59"/><text x="43" y="148" class="t-lbl2">v0.8.0 (incremental diff + PK-bounded batch)</text>
