    <line x1="771.5" y1="168" x2="771.5" y2="386" stroke="#ECEAE2" stroke-width="1"/>
    <text x="771.5" y="399" text-anchor="middle" class="t-axis">600M</text>
    <text x="582" y="191" text-anchor="end" class="t-lbl">ripgrep</text>
    <text x="582" y="207" text-anchor="end" class="t-axis">0.76 s</text>
    <rect x="594" y="176" width="26.4" height="16" rx="3" fill="#947123" opacity="0.82"/>
