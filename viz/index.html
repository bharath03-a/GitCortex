<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfa" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='14' fill='%23faf9f5'/%3E%3Cline x1='18' y1='18' x2='46' y2='32' stroke='%23cc785c' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='18' y1='18' x2='32' y2='50' stroke='%23cc785c' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='46' y1='32' x2='32' y2='50' stroke='%23cc785c' stroke-width='2.5' stroke-linecap='round' opacity='0.7'/%3E%3Ccircle cx='18' cy='18' r='7' fill='%23cc785c'/%3E%3Ccircle cx='46' cy='32' r='5.5' fill='%23e0a07f'/%3E%3Ccircle cx='32' cy='50' r='5.5' fill='%23e0a07f'/%3E%3C/svg%3E"
    />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (() => {
        const saved = localStorage.getItem("gitcortex-theme");
        const theme = saved === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>GitCortex Viz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
